<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#070b18" />
    <meta
      name="description"
      content="Una carta frente al mar, al atardecer."
    />
    <title>Tren al sur</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='s' x1='0' y1='0' x2='0' y2='1'%3E%3Cstop offset='0' stop-color='%23070b18'/%3E%3Cstop offset='1' stop-color='%23c9755a'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='64' height='64' rx='14' fill='url(%23s)'/%3E%3Ccircle cx='42' cy='26' r='9' fill='%23ffd9a8'/%3E%3C/svg%3E"
    />
  </head>
  <body>
    <div class="sky" aria-hidden="true"></div>
    <div class="scene" id="scene" aria-hidden="true"></div>
    <div class="vignette" aria-hidden="true"></div>

    <main class="stage">
      <section class="letter" data-state="closed" aria-label="Carta">
        <div class="letter__overlay" data-close></div>

        <button
          class="letter-trigger"
          type="button"
          aria-expanded="false"
          aria-controls="letter-sheet"
        >
          <span class="envelope" aria-hidden="true">
            <span class="envelope__back"></span>
            <span class="envelope__paper"></span>
            <span class="envelope__front"></span>
            <span class="envelope__flap">
              <span class="envelope__seal"></span>
            </span>
          </span>
          <span class="letter-trigger__hint">Abrir</span>
        </button>

        <article
          class="letter-sheet"
          id="letter-sheet"
          tabindex="-1"
          aria-hidden="true"
          aria-label="Contenido de la carta"
        >
          <button class="letter-sheet__close" type="button" aria-label="Cerrar carta">
            <span aria-hidden="true"></span>
          </button>
          <div class="letter-sheet__page">
            <div class="letter-content">
              <!-- Agrega aquí el contenido de tu carta -->
            </div>
          </div>
        </article>
      </section>
    </main>

    <button
      class="sound-toggle"
      type="button"
      aria-pressed="false"
      aria-label="Activar sonido ambiental"
    >
      <span class="sound-toggle__bars" aria-hidden="true">
        <i></i><i></i><i></i>
      </span>
    </button>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
